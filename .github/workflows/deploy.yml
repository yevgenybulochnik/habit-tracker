name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The repo default for GITHUB_TOKEN is read-only; deploy-pages needs these.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Build
        # Project site lives at /<repo>/, so assets must be based there.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Skip Jekyll processing
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
